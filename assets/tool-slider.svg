<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">Signature toolkit carousel</title>
  <desc id="desc">Animated carousel showcasing rotating technology stacks used by Lintshiwe Ntoampi.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="55%" stop-color="#111C3D" />
      <stop offset="100%" stop-color="#070A14" />
    </linearGradient>
    <filter id="glow" x="-25%" y="-40%" width="150%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style><![CDATA[
      svg { font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif; }
      .frame { fill: url(#bg); stroke: #27345C; stroke-width: 2.4px; rx: 36px; ry: 36px; filter: url(#glow); }
      .headline { font-size: 30px; font-weight: 600; fill: #F3F6FF; letter-spacing: 1.4px; }
      .subline { font-size: 17px; fill: #8DA4D8; letter-spacing: 1.1px; }
      .slide { opacity: 0; animation: fade 28s infinite ease-in-out; }
      .slide:nth-of-type(1) { animation-delay: 0s; }
      .slide:nth-of-type(2) { animation-delay: 7s; }
      .slide:nth-of-type(3) { animation-delay: 14s; }
      .slide:nth-of-type(4) { animation-delay: 21s; }
      @keyframes fade {
        0%, 15% { opacity: 0; }
        20%, 40% { opacity: 1; }
        45%, 100% { opacity: 0; }
      }
      .token rect { width: 136px; height: 76px; rx: 24px; ry: 24px; }
      .token text { font-size: 20px; font-weight: 600; dominant-baseline: middle; text-anchor: middle; }
      .ts { fill: #2F74C0; }
      .js { fill: #EFD81D; }
      .react { fill: #62DAFB; }
      .tailwind { fill: #38BDF8; }
      .next { fill: #FFFFFF; }
      .node { fill: #7DC528; }
      .express { fill: #F5F5F5; }
      .nest { fill: #E0234E; }
      .firebase { fill: #FFCB2B; }
      .sqlite { fill: #3F92D2; }
      .postgres { fill: #336791; }
      .redis { fill: #D82C20; }
      .docker { fill: #0DB7ED; }
      .bash { fill: #2C3E50; }
      .ansible { fill: #111111; }
      .gha { fill: #24292E; }
      .token text.light { fill: #F2F5FF; }
    ]]></style>
  </defs>
  <rect class="frame" x="18" y="18" width="864" height="224" rx="36" ry="36" />
  <text class="headline" x="70" y="84">Signature Toolkit</text>
  <text class="subline" x="70" y="114">Stacks on rotation · Auto-loop</text>
  <g class="slide">
    <g class="token ts" transform="translate(250,120)"><rect /><text x="68" y="38" class="light">TypeScript</text></g>
    <g class="token js" transform="translate(410,120)"><rect /><text x="68" y="38">JavaScript</text></g>
    <g class="token react" transform="translate(570,120)"><rect /><text x="68" y="38" class="light">React</text></g>
    <g class="token tailwind" transform="translate(730,120)"><rect /><text x="68" y="38" class="light">Tailwind</text></g>
    <text class="subline" x="250" y="210">Design-led frontends with motion systems</text>
  </g>
  <g class="slide">
    <g class="token next" transform="translate(250,120)"><rect /><text x="68" y="38">Next.js</text></g>
    <g class="token node" transform="translate(410,120)"><rect /><text x="68" y="38" class="light">Node</text></g>
    <g class="token express" transform="translate(570,120)"><rect /><text x="68" y="38">Express</text></g>
    <g class="token nest" transform="translate(730,120)"><rect /><text x="68" y="38" class="light">NestJS</text></g>
    <text class="subline" x="250" y="210">APIs, real-time comms, and automation services</text>
  </g>
  <g class="slide">
    <g class="token firebase" transform="translate(250,120)"><rect /><text x="68" y="38">Firebase</text></g>
    <g class="token sqlite" transform="translate(410,120)"><rect /><text x="68" y="38" class="light">SQLite</text></g>
    <g class="token postgres" transform="translate(570,120)"><rect /><text x="68" y="38" class="light">Postgres</text></g>
    <g class="token redis" transform="translate(730,120)"><rect /><text x="68" y="38" class="light">Redis</text></g>
    <text class="subline" x="250" y="210">Operational data layers and caching strategies</text>
  </g>
  <g class="slide">
    <g class="token docker" transform="translate(250,120)"><rect /><text x="68" y="38" class="light">Docker</text></g>
    <g class="token bash" transform="translate(410,120)"><rect /><text x="68" y="38" class="light">Bash</text></g>
    <g class="token ansible" transform="translate(570,120)"><rect /><text x="68" y="38" class="light">Ansible</text></g>
    <g class="token gha" transform="translate(730,120)"><rect /><text x="68" y="38" class="light">GH Actions</text></g>
    <text class="subline" x="250" y="210">Delivery, automation, and observability tooling</text>
  </g>
</svg>
