<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960" role="img" aria-labelledby="title desc">
  <title id="title">Lintshiwe GUI Dashboard</title>
  <desc id="desc">Unified dashboard showing signature snapshot, current focus, and featured work cards.</desc>
  <defs>
    <linearGradient id="boardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060914" />
      <stop offset="45%" stop-color="#101F3C" />
      <stop offset="100%" stop-color="#070D18" />
    </linearGradient>
    <linearGradient id="panelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16284A" />
      <stop offset="100%" stop-color="#0B1424" />
    </linearGradient>
    <linearGradient id="chipGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F3D7A" />
      <stop offset="100%" stop-color="#112247" />
    </linearGradient>
    <filter id="boardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="chipGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style><![CDATA[
      svg { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; }
      .board { fill: url(#boardBg); stroke: rgba(151,197,255,0.3); stroke-width: 2.4px; rx: 42px; ry: 42px; filter: url(#boardGlow); }
      .panel { fill: rgba(9,18,35,0.8); stroke: rgba(92,145,255,0.2); stroke-width: 1.8px; rx: 30px; ry: 30px; }
      .panel-title { font-size: 32px; fill: #F1F6FF; font-weight: 700; letter-spacing: 1.8px; }
      .divider { stroke: rgba(147,187,255,0.2); stroke-width: 1.2; stroke-dasharray: 4 6; }
      .chip { fill: url(#chipGradient); stroke: rgba(122,176,255,0.3); stroke-width: 1.4px; rx: 20px; ry: 20px; filter: url(#chipGlow); }
      .chip-title { font-size: 17px; fill: #E6EEFF; font-weight: 600; letter-spacing: 0.8px; }
      .chip-body { font-size: 14px; fill: #94ACDA; letter-spacing: 0.6px; }
      .chip-meta { font-size: 13px; fill: rgba(183,210,255,0.8); letter-spacing: 0.6px; }
      .badge { fill: rgba(114,245,255,0.15); stroke: rgba(114,245,255,0.3); stroke-width: 1.2px; rx: 16px; ry: 16px; }
      .badge-text { font-size: 12px; fill: #C7F2FF; letter-spacing: 0.6px; }
      @keyframes breathe {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      .chip-group:nth-of-type(1) { animation: breathe 7s ease-in-out infinite; }
      .chip-group:nth-of-type(2) { animation: breathe 7s ease-in-out infinite 1.2s; }
      .chip-group:nth-of-type(3) { animation: breathe 7s ease-in-out infinite 2.4s; }
      .chip-group:nth-of-type(4) { animation: breathe 7s ease-in-out infinite 3.6s; }
      .chip-group:nth-of-type(5) { animation: breathe 7s ease-in-out infinite 4.8s; }
      .chip-group:nth-of-type(6) { animation: breathe 7s ease-in-out infinite 6s; }
    ]]></style>
  </defs>
  <rect class="board" x="24" y="24" width="912" height="912" rx="42" ry="42" />
  <text class="panel-title" x="120" y="108">Experience Control Room</text>
  <line class="divider" x1="120" y1="132" x2="840" y2="132" />

  <g transform="translate(80,150)">
    <rect class="panel" width="800" height="280" />
    <text class="panel-title" x="40" y="60">Signature Snapshot</text>
    <g transform="translate(40,90)">
      <g class="chip-group" transform="translate(0,0)">
        <rect class="chip" width="220" height="92" />
        <text class="chip-title" x="20" y="36">Full-Stack Craft</text>
        <text class="chip-body" x="20" y="62">End-to-end product stories with responsive design systems.</text>
      </g>
      <g class="chip-group" transform="translate(260,0)">
        <rect class="chip" width="220" height="92" />
        <text class="chip-title" x="20" y="36">Liquid Glass UI</text>
        <text class="chip-body" x="20" y="62">Motion-led experiments inspired by cinematic interfaces.</text>
      </g>
      <g class="chip-group" transform="translate(520,0)">
        <rect class="chip" width="220" height="92" />
        <text class="chip-title" x="20" y="36">Secure Engineering</text>
        <text class="chip-body" x="20" y="62">Local-first encryption blended with offensive insights.</text>
      </g>
      <g class="chip-group" transform="translate(0,120)">
        <rect class="chip" width="220" height="92" />
        <text class="chip-title" x="20" y="36">DevOps Mindset</text>
        <text class="chip-body" x="20" y="62">Red Hat administration, observability, automated delivery.</text>
      </g>
      <g class="chip-group" transform="translate(260,120)">
        <rect class="chip" width="220" height="92" />
        <text class="chip-title" x="20" y="36">Terminal R&amp;D</text>
        <text class="chip-body" x="20" y="62">Browser-based terminals and OS-level scripting adventures.</text>
      </g>
      <g class="chip-group" transform="translate(520,120)">
        <rect class="chip" width="220" height="92" />
        <text class="chip-title" x="20" y="36">Community Driven</text>
        <text class="chip-body" x="20" y="62">Mentoring peers through UI, security, and Linux labs.</text>
      </g>
    </g>
  </g>

  <g transform="translate(80,460)">
    <rect class="panel" width="800" height="180" />
    <text class="panel-title" x="40" y="60">Current Focus Pulse</text>
    <g transform="translate(40,90)">
      <g class="chip-group" transform="translate(0,0)">
        <rect class="chip" width="220" height="92" />
        <rect class="badge" width="88" height="26" x="18" y="18" />
        <text class="badge-text" x="62" y="36" text-anchor="middle">Shipping</text>
        <text class="chip-title" x="20" y="66">Salon Starter Kit</text>
        <text class="chip-meta" x="20" y="82">Themes · booking flows · deployment automation</text>
      </g>
      <g class="chip-group" transform="translate(260,0)">
        <rect class="chip" width="220" height="92" />
        <rect class="badge" width="92" height="26" x="18" y="18" />
        <text class="badge-text" x="64" y="36" text-anchor="middle">Learning</text>
        <text class="chip-title" x="20" y="66">MITM Payload Lab</text>
        <text class="chip-meta" x="20" y="82">Python · mitmproxy · telemetry analysis</text>
      </g>
      <g class="chip-group" transform="translate(520,0)">
        <rect class="chip" width="220" height="92" />
        <rect class="badge" width="112" height="26" x="18" y="18" />
        <text class="badge-text" x="74" y="36" text-anchor="middle">Collaborating</text>
        <text class="chip-title" x="20" y="66">Security x UX</text>
        <text class="chip-meta" x="20" y="82">UI-rich tooling &amp; education platform partners</text>
      </g>
    </g>
  </g>

  <g transform="translate(80,680)">
    <rect class="panel" width="800" height="220" />
    <text class="panel-title" x="40" y="60">Featured Work Launchpad</text>
    <g transform="translate(40,90)">
      <g class="chip-group" transform="translate(0,0)">
        <rect class="chip" width="220" height="110" />
        <rect class="badge" width="112" height="26" x="18" y="18" />
        <text class="badge-text" x="74" y="36" text-anchor="middle">PasswordManager</text>
        <text class="chip-title" x="20" y="66">Encrypted vault with adaptive UX.</text>
        <text class="chip-meta" x="20" y="86">Python · Tkinter · SQLite</text>
      </g>
      <g class="chip-group" transform="translate(260,0)">
        <rect class="chip" width="220" height="110" />
        <rect class="badge" width="116" height="26" x="18" y="18" />
        <text class="badge-text" x="76" y="36" text-anchor="middle">CourseCampus</text>
        <text class="chip-title" x="20" y="66">Hybrid e-learning authoring suite.</text>
        <text class="chip-meta" x="20" y="86">Next.js · Tailwind · Firebase</text>
      </g>
      <g class="chip-group" transform="translate(520,0)">
        <rect class="chip" width="220" height="110" />
        <rect class="badge" width="74" height="26" x="18" y="18" />
        <text class="badge-text" x="56" y="36" text-anchor="middle">Salon</text>
        <text class="chip-title" x="20" y="66">Production-ready booking starter.</text>
        <text class="chip-meta" x="20" y="86">React · TypeScript · Tailwind</text>
      </g>
    </g>
    <g transform="translate(40,210)">
      <g class="chip-group" transform="translate(0,-110)">
        <rect class="chip" width="220" height="110" />
        <rect class="badge" width="112" height="26" x="18" y="18" />
        <text class="badge-text" x="74" y="36" text-anchor="middle">Slade_MITM</text>
        <text class="chip-title" x="20" y="66">Ethical proxy for payload analysis.</text>
        <text class="chip-meta" x="20" y="86">Python · mitmproxy</text>
      </g>
    </g>
  </g>
</svg>
