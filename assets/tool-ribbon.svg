<svg xmlns="http://www.w3.org/2000/svg" width="900" height="140" viewBox="0 0 900 140" role="img" aria-labelledby="title desc">
  <title id="title">Toolkit technology ribbon</title>
  <desc id="desc">Continuously scrolling ribbon showing Lintshiwe Ntoampi's core technologies.</desc>
  <defs>
    <linearGradient id="ribbonBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#101933" />
      <stop offset="55%" stop-color="#0D1428" />
      <stop offset="100%" stop-color="#070B14" />
    </linearGradient>
    <filter id="ribbonGlow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style><![CDATA[
      svg { font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif; }
  .shell { fill: url(#ribbonBg); stroke: #243155; stroke-width: 2px; rx: 28px; ry: 28px; filter: url(#ribbonGlow); }
  .token rect { width: 90px; height: 90px; rx: 24px; ry: 24px; }
  .token text { font-size: 24px; font-weight: 600; fill: #0B1122; text-anchor: middle; dominant-baseline: middle; }
      .token text.light { fill: #F2F5FF; }
      .ts { fill: #2F74C0; }
      .js { fill: #EFD81D; }
      .py { fill: #3474A5; }
      .java { fill: #EA4F34; }
      .react { fill: #62DAFB; }
      .next { fill: #FFFFFF; }
      .node { fill: #7DC528; }
      .tailwind { fill: #38BDF8; }
      .sqlite { fill: #3F92D2; }
      .firebase { fill: #FFCB2B; }
      .docker { fill: #0DB7ED; }
      .ansible { fill: #111111; }
      .linux { fill: #F8C200; }
      .bash { fill: #2C3E50; }
      .gha { fill: #24292E; }
    ]]></style>
  </defs>
  <rect class="shell" x="16" y="16" width="868" height="108" rx="28" ry="28" />
  <clipPath id="clip">
    <rect x="16" y="16" width="868" height="108" rx="28" ry="28" />
  </clipPath>
  <g clip-path="url(#clip)">
    <g id="track" transform="translate(16,26)">
      <g class="set">
        <g class="token ts" transform="translate(0,0)"><rect /><text x="45" y="45" class="light">TS</text></g>
        <g class="token js" transform="translate(110,0)"><rect /><text x="45" y="45">JS</text></g>
        <g class="token py" transform="translate(220,0)"><rect /><text x="45" y="45" class="light">Py</text></g>
        <g class="token java" transform="translate(330,0)"><rect /><text x="45" y="45" class="light">Java</text></g>
        <g class="token react" transform="translate(440,0)"><rect /><text x="45" y="45" class="light">React</text></g>
        <g class="token next" transform="translate(550,0)"><rect /><text x="45" y="45">Next</text></g>
        <g class="token tailwind" transform="translate(660,0)"><rect /><text x="45" y="45" class="light">TW</text></g>
        <g class="token node" transform="translate(770,0)"><rect /><text x="45" y="45" class="light">Node</text></g>
        <g class="token sqlite" transform="translate(880,0)"><rect /><text x="45" y="45" class="light">SQL</text></g>
        <g class="token firebase" transform="translate(990,0)"><rect /><text x="45" y="45" class="light">FB</text></g>
        <g class="token docker" transform="translate(1100,0)"><rect /><text x="45" y="45" class="light">Docker</text></g>
        <g class="token bash" transform="translate(1210,0)"><rect /><text x="45" y="45" class="light">Bash</text></g>
        <g class="token ansible" transform="translate(1320,0)"><rect /><text x="45" y="45" class="light">A</text></g>
        <g class="token linux" transform="translate(1430,0)"><rect /><text x="45" y="45">🐧</text></g>
        <g class="token gha" transform="translate(1540,0)"><rect /><text x="45" y="45" class="light">GHA</text></g>
      </g>
      <g class="set" transform="translate(1540,0)">
        <g class="token ts" transform="translate(0,0)"><rect /><text x="45" y="45" class="light">TS</text></g>
        <g class="token js" transform="translate(110,0)"><rect /><text x="45" y="45">JS</text></g>
        <g class="token py" transform="translate(220,0)"><rect /><text x="45" y="45" class="light">Py</text></g>
        <g class="token java" transform="translate(330,0)"><rect /><text x="45" y="45" class="light">Java</text></g>
        <g class="token react" transform="translate(440,0)"><rect /><text x="45" y="45" class="light">React</text></g>
        <g class="token next" transform="translate(550,0)"><rect /><text x="45" y="45">Next</text></g>
        <g class="token tailwind" transform="translate(660,0)"><rect /><text x="45" y="45" class="light">TW</text></g>
        <g class="token node" transform="translate(770,0)"><rect /><text x="45" y="45" class="light">Node</text></g>
        <g class="token sqlite" transform="translate(880,0)"><rect /><text x="45" y="45" class="light">SQL</text></g>
        <g class="token firebase" transform="translate(990,0)"><rect /><text x="45" y="45" class="light">FB</text></g>
        <g class="token docker" transform="translate(1100,0)"><rect /><text x="45" y="45" class="light">Docker</text></g>
        <g class="token bash" transform="translate(1210,0)"><rect /><text x="45" y="45" class="light">Bash</text></g>
        <g class="token ansible" transform="translate(1320,0)"><rect /><text x="45" y="45" class="light">A</text></g>
        <g class="token linux" transform="translate(1430,0)"><rect /><text x="45" y="45">🐧</text></g>
        <g class="token gha" transform="translate(1540,0)"><rect /><text x="45" y="45" class="light">GHA</text></g>
      </g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1540 0" dur="28s" repeatCount="indefinite" />
    </g>
  </g>
</svg>
