<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 120" width="100%" style="max-width: 680px;">
  <!-- Name in terminal green -->
  <text x="340" y="55" text-anchor="middle" fill="#00ff41" font-family="'Courier New',monospace" font-size="36" font-weight="bold">
    Lintshiwe Ntoampi
  </text>

  <!-- Blinking cursor next to name -->
  <text x="530" y="55" fill="#00ff41" font-family="monospace" font-size="36" font-weight="bold">
    _
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </text>

  <!-- Terminal divider -->
  <text x="340" y="78" text-anchor="middle" fill="#00ff41" font-family="monospace" font-size="14" opacity="0.3">
    $ cd /home/lintshiwe &amp;&amp; cat profile.txt
  </text>

  <!-- Subtitle in dimmer green -->
  <text x="340" y="105" text-anchor="middle" fill="#00cc33" font-family="'Courier New',monospace" font-size="14" opacity="0.7">
    $ Full-Stack Engineer | Java Spring Boot Developer | SOC Analyst
  </text>
</svg>
